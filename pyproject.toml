[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insighttext"
version = "0.1.0"
description = "A text analysis toolkit: extractive summarization, keyword extraction, sentiment analysis, and a web UI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Abdulmalek Azouz" }]
keywords = ["nlp", "text-analysis", "summarization", "sentiment-analysis", "machine-learning"]

dependencies = [
    "pydantic>=2.4,<3",
    "scikit-learn>=1.3,<2",
    "Flask>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
insighttext = "insighttext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insighttext = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# A plain whitespace-separated word list reads more naturally here than a
# giant list literal for a ~175-word stopword list.
"src/insighttext/preprocessing.py" = ["SIM905"]
